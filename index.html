
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤ إلى زوزايتي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Cairo",sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#ffd6e7,#fff0f6,#f8d9ff);
    overflow:hidden;
    color:#333;
}

.app{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:min(430px,100%);
    display:grid;
    position:relative;
}

.screen{
    grid-area:1/1;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border-radius:30px;
    box-shadow:0 20px 60px rgba(170,70,120,.18);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 22px 65px;
    opacity:0;
    pointer-events:none;
    transform:scale(1.05) translateY(20px);
    filter:blur(8px);
    transition:opacity .6s,transform .7s,filter .6s;
}

.screen.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1) translateY(0);
    filter:blur(0);
}

.art{
    width:250px;
    height:250px;
    margin-bottom:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:25px;
}

.art img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    font-size:26px;
    line-height:1.6;
    color:#d63384;
    min-height:45px;
    margin-bottom:10px;
    font-weight:800;
}

.screen>p{
    font-size:17px;
    line-height:1.8;
    color:#555;
}

.typing-cursor::after{
    content:"|";
    margin-right:3px;
    animation:cursorBlink .55s infinite;
}

@keyframes cursorBlink{
    50%{opacity:0}
}

.screen>button{
    border:none;
    margin-top:25px;
    padding:13px 30px;
    border-radius:50px;
    background:linear-gradient(135deg,#ec4899,#d63384);
    color:white;
    font-family:inherit;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    opacity:0;
    transform:translateY(15px);
    transition:.4s;
}

.screen>button.show-button{
    opacity:1;
    transform:translateY(0);
}

.screen>button:active{
    transform:scale(.93);
}

.big-heart{
    font-size:100px;
    margin-top:25px;
    cursor:pointer;
    user-select:none;
    animation:heartBeat 1s infinite;
}

@keyframes heartBeat{
    50%{transform:scale(1.13)}
}

.message-card{
    width:100%;
    max-height:350px;
    overflow:auto;
    padding:25px 20px;
    border-radius:25px;
    background:rgba(255,255,255,.82);
    box-shadow:0 10px 35px rgba(180,70,130,.15);
    text-align:center;
}

.message-card p{
    font-size:18px;
    line-height:2;
    color:#555;
    white-space:pre-line;
}

/* عداد الأيام */

.counter{
    width:100%;
    margin:20px 0 5px;
    padding:18px;
    border-radius:22px;
    background:linear-gradient(135deg,#ffe0ed,#f8d9ff);
    box-shadow:0 8px 25px rgba(214,51,132,.12);
}

.counter-title{
    color:#b52b72;
    font-size:15px;
    font-weight:700;
}

.counter-number{
    color:#d63384;
    font-size:42px;
    font-weight:800;
    line-height:1.5;
}

.counter-caption{
    color:#9d4775;
    font-size:13px;
}

/* النقاط */

.dots{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:7px;
    z-index:20;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ddd;
    transition:.3s;
}

.dot.active{
    width:22px;
    border-radius:10px;
    background:#d63384;
}

/* القلوب الطائرة */

.floating-heart{
    position:fixed;
    bottom:-30px;
    font-size:20px;
    pointer-events:none;
    animation:floatHeart linear forwards;
    z-index:50;
}

@keyframes floatHeart{
    0%{
        opacity:0;
        transform:translateY(0) scale(.6);
    }
    15%{opacity:1}
    100%{
        opacity:0;
        transform:translateY(-100vh) scale(1.3) rotate(25deg);
    }
}

/* الظرف */

.envelope-screen{
    position:fixed;
    inset:0;
    z-index:1000;
    background:linear-gradient(135deg,#ffd6e7,#fff0f6,#f8d9ff);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    transition:opacity .8s,visibility .8s;
}

.envelope-screen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.envelope-screen h2{
    color:#d63384;
    margin-bottom:35px;
    font-size:25px;
}

.envelope{
    position:relative;
    width:270px;
    height:180px;
    background:#ec4899;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 15px 40px rgba(190,60,120,.3);
}

.envelope::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    border-left:135px solid transparent;
    border-right:135px solid transparent;
    border-top:110px solid #f472b6;
    transform-origin:top;
    transition:transform .8s;
    z-index:3;
}

.envelope::after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    border-left:135px solid transparent;
    border-right:135px solid transparent;
    border-bottom:100px solid #db2777;
    z-index:2;
}

.envelope.open::before{
    transform:rotateX(180deg);
}

.letter{
    position:absolute;
    width:220px;
    height:140px;
    background:#fff7fb;
    left:25px;
    top:15px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d63384;
    font-size:40px;
    transition:transform .8s;
    z-index:1;
}

.envelope.open .letter{
    transform:translateY(-100px);
}

.seal{
    position:absolute;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#fff;
    color:#e11d74;
    display:flex;
    align-items:center;
    justify-content:center;
    left:111px;
    top:75px;
    font-size:25px;
    z-index:4;
}

.envelope-hint{
    margin-top:35px;
    color:#a84b79;
    font-size:15px;
}

/* شاشة النهاية السينمائية */

.final-screen{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
    background:radial-gradient(ellipse at center,#44204e,#170e2b 65%,#080713);
    color:white;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity 1.2s,visibility 1.2s;
    overflow:hidden;
}

.final-screen.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.final-screen h1{
    color:#ff9bc9;
    font-size:34px;
    margin-bottom:15px;
    text-shadow:0 0 25px #ff69b4;
}

.final-screen .final-text{
    font-size:19px;
    line-height:2;
    color:#ffe6f1;
    max-width:400px;
}

.final-heart{
    font-size:85px;
    margin:25px 0;
    filter:drop-shadow(0 0 20px #ff4f9a);
    animation:heartBeat 1.2s infinite;
}

.final-screen button{
    margin-top:25px;
    border:1px solid #ffacd0;
    background:rgba(255,255,255,.1);
    color:white;
    border-radius:50px;
    padding:12px 28px;
    font-family:inherit;
    font-size:16px;
    cursor:pointer;
}

/* النجوم */

.star{
    position:absolute;
    color:white;
    font-size:12px;
    animation:twinkle 2s infinite alternate;
    pointer-events:none;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.7)}
    to{opacity:1;transform:scale(1.4)}
}

.final-heart-float{
    position:absolute;
    bottom:-30px;
    animation:finalFloat 8s linear forwards;
    pointer-events:none;
}

@keyframes finalFloat{
    to{
        transform:translateY(-110vh) rotate(40deg);
        opacity:0;
    }
}

@media(max-width:500px){
    .art{
        width:220px;
        height:220px;
    }
    h1{font-size:23px}
    .screen>p{font-size:16px}
}

@media(max-height:720px){
    .screen{padding:20px 18px 55px}
    .art{width:165px;height:165px;margin-bottom:12px}
    .message-card{max-height:210px}
}
</style>
</head>

<body>

<audio id="bgSong" src="song.mp3" loop></audio>

<!-- ظرف الرسالة -->

<div class="envelope-screen" id="envelopeScreen">

<div class="app">

<div class="final-screen" id="finalScreen">

        أحبج اليوم وباچر وكل يوم 🌷
    </p>

    <button onclick="restart()">نعيد الحكاية من البداية ↺</button>

<script>

/* =========================
   إعدادات الموقع
========================= */

/*
غيّر التاريخ إلى تاريخ بداية تعارفكم الحقيقي
بالصيغة: السنة-الشهر-اليوم
مثال: 2025-11-19
*/

const START_DATE = "2026-9-19";

/* =========================
   العناصر
========================= */

const screens = [...document.querySelectorAll(".screen")];
const dots = document.getElementById("dots");
const audio = document.getElementById("bgSong");

const envelope = document.getElementById("envelope");
const envelopeScreen = document.getElementById("envelopeScreen");
const finalScreen = document.getElementById("finalScreen");

let current = 0;
let typingRun = 0;
let started = false;

/* =========================
   فتح الظرف
========================= */

function openLetter(){

    if(started) return;

    started = true;

    envelope.classList.add("open");

    audio.play().catch(()=>{});

    setTimeout(()=>{

        envelopeScreen.classList.add("hide");

        playScreen(screens[0]);

    },1100);

}

/* =========================
   عداد الأيام
========================= */

function updateCounter(){

    const start = new Date(START_DATE + "T00:00:00");

    const today = new Date();

    today.setHours(0,0,0,0);

    if(isNaN(start.getTime()) || start > today){
        document.getElementById("daysCount").textContent = "—";
        return;
    }

    const difference = today.getTime() - start.getTime();

    const days = Math.floor(difference / 86400000);

    document.getElementById("daysCount").textContent =
        days.toLocaleString("en-US");

}

updateCounter();

setInterval(updateCounter,60000);

/* =========================
   إنشاء النقاط
========================= */

screens.forEach((screen,index)=>{

    const dot = document.createElement("div");

    dot.className = "dot";

    if(index === 0){
        dot.classList.add("active");
    }

    dot.onclick = ()=>{
        if(started) show(index);
    };

    dots.appendChild(dot);

});

/* =========================
   الانتظار
========================= */

function wait(ms){

    return new Promise(resolve=>{
        setTimeout(resolve,ms);
    });

}

/* =========================
   الكتابة حرف حرف
========================= */

function typeText(element,speed,run){

    if(!element){
        return Promise.resolve(true);
    }

    const text = element.dataset.text || "";

    element.textContent = "";
    element.classList.add("typing-cursor");

    return new Promise(resolve=>{

        let i = 0;

        function write(){

            if(run !== typingRun){

                element.textContent = "";
                element.classList.remove("typing-cursor");

                resolve(false);
                return;

            }

            if(i < text.length){

                element.textContent += text.charAt(i);

                i++;

                setTimeout(write,speed);

            }else{

                element.classList.remove("typing-cursor");

                resolve(true);

            }

        }

        write();

    });

}

/* =========================
   تشغيل كتابة الشاشة
========================= */

async function playScreen(screen){

    const run = ++typingRun;

    const title = screen.querySelector("h1[data-text]");
    const normalText = screen.querySelector(":scope > p[data-text]");
    const messageText = screen.querySelector(".message-card p[data-text]");
    const button = screen.querySelector(":scope > button");

    if(button){
        button.classList.remove("show-button");
    }

    if(title) title.textContent = "";

    if(normalText) normalText.textContent = "";

    if(messageText) messageText.textContent = "";

    await wait(450);

    if(run !== typingRun) return;

    if(title && title.dataset.text){

        if(!await typeText(title,40,run)) return;

        await wait(120);

    }

    if(run !== typingRun) return;

    if(normalText && normalText.dataset.text){

        if(!await typeText(normalText,28,run)) return;

        await wait(180);

    }

    if(run !== typingRun) return;

    if(messageText && messageText.dataset.text){

        if(!await typeText(messageText,25,run)) return;

        await wait(200);

    }

    if(run !== typingRun) return;

    if(button){
        button.classList.add("show-button");
    }

    createHearts();

}

/* =========================
   الانتقال بين الشاشات
========================= */

function show(index){

    if(index < 0 || index >= screens.length) return;

    screens[current].classList.remove("active");

    current = index;

    screens[current].classList.add("active");

    [...dots.children].forEach((dot,i)=>{

        dot.classList.toggle("active",i === current);

    });

    playScreen(screens[current]);

}

function next(){

    if(current < screens.length - 1){

        show(current + 1);

    }

}

function previous(){

    if(current > 0){

        show(current - 1);

    }

}

/* =========================
   شاشة النهاية
========================= */

function showFinal(){

    if(current !== screens.length - 1) return;

    typingRun++;

    screens[current].classList.remove("active");

    dots.style.display = "none";

    finalScreen.classList.add("show");

    createStars();

    finalHearts();

}

/* =========================
   النجوم السينمائية
========================= */

function createStars(){

    if(finalScreen.dataset.starsCreated) return;

    finalScreen.dataset.starsCreated = "true";

    for(let i=0;i<65;i++){

        const star = document.createElement("div");

        star.className = "star";

        star.textContent = "✦";

        star.style.left = Math.random()*100 + "%";

        star.style.top = Math.random()*100 + "%";

        star.style.animationDelay = Math.random()*3 + "s";

        star.style.fontSize = (6 + Math.random()*12) + "px";

        finalScreen.appendChild(star);

    }

}

/* =========================
   قلوب شاشة النهاية
========================= */

function finalHearts(){

    setInterval(()=>{

        if(!finalScreen.classList.contains("show")) return;

        const heart = document.createElement("div");

        heart.className = "final-heart-float";

        heart.textContent = ["❤️","💗","💕","🤍"][
            Math.floor(Math.random()*4)
        ];

        heart.style.left = Math.random()*100 + "vw";

        heart.style.fontSize = (15 + Math.random()*20) + "px";

        heart.style.animationDuration = (5 + Math.random()*4) + "s";

        finalScreen.appendChild(heart);

        setTimeout(()=>heart.remove(),9000);

    },900);

}

/* =========================
   إعادة البداية
========================= */

function restart(){

    finalScreen.classList.remove("show");

    dots.style.display = "flex";

    document.querySelectorAll(".final-heart-float").forEach(e=>e.remove());

    current = 0;

    show(0);

}

/* =========================
   القلوب الطائرة
========================= */

function createHearts(){

    const hearts = ["❤️","💗","💕","❣️","🤍"];

    for(let i=0;i<5;i++){

        const heart = document.createElement("div");

        heart.className = "floating-heart";

        heart.textContent =
            hearts[Math.floor(Math.random()*hearts.length)];

        heart.style.left = Math.random()*100 + "vw";

        heart.style.animationDuration = (4 + Math.random()*3) + "s";

        heart.style.fontSize = (15 + Math.random()*15) + "px";

        document.body.appendChild(heart);

        setTimeout(()=>heart.remove(),7000);

    }

}

/* =========================
   لوحة المفاتيح
========================= */

document.addEventListener("keydown",(e)=>{

    if(!started || finalScreen.classList.contains("show")) return;

    if(e.key === "ArrowLeft"){
        next();
    }

    if(e.key === "ArrowRight"){
        previous();
    }

});

</script>

</body>
</html>
